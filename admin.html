<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة تحكم - السور الأبيض</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap">
<style>
  :root{ --violet:#6c4fd1; --coral:#e0503f; --teal:#1f9c86; --ink:#151217; --muted:#6b6670; --rule:rgba(20,18,25,.14); --bg:#faf9fc; }
  *{ box-sizing:border-box; }
  body{ font-family:'Tajawal',sans-serif; background:var(--bg); color:var(--ink); margin:0; direction:rtl; }
  .wrap{ max-width:760px; margin:0 auto; padding:2rem 1.25rem 4rem; }
  h1{ font-size:1.4rem; margin:0; }
  .login-box{ max-width:360px; margin:5rem auto; background:#fff; border:1px solid var(--rule); border-radius:16px; padding:2rem; }
  .login-box h1{ font-size:1.3rem; margin-bottom:1.5rem; }
  .login-box label{ display:block; font-size:.85rem; font-weight:600; margin-bottom:.4rem; }
  .login-box input{ width:100%; padding:.65rem .8rem; border:1.5px solid var(--rule); border-radius:10px; margin-bottom:1rem; font-family:inherit; font-size:.95rem; }
  .login-box button{ width:100%; padding:.8rem; border:none; border-radius:10px; background:var(--violet); color:#fff; font-weight:700; font-size:1rem; cursor:pointer; }
  .err{ color:#c0392b; font-size:.85rem; margin-bottom:1rem; display:none; }
  .top-bar{ display:flex; justify-content:space-between; align-items:center; margin-bottom:1.5rem; }
  .logout{ background:none; border:1px solid var(--rule); border-radius:10px; padding:.4rem .9rem; cursor:pointer; font-family:inherit; font-size:.85rem; }
  .tabs{ display:flex; gap:.6rem; margin-bottom:1.5rem; }
  .tab-btn{ padding:.5rem 1.1rem; border-radius:999px; border:1.5px solid var(--rule); background:#fff; cursor:pointer; font-family:inherit; font-weight:600; font-size:.9rem; color:var(--ink); }
  .tab-btn.active{ background:var(--violet); color:#fff; border-color:var(--violet); }
  .card{ background:#fff; border:1px solid var(--rule); border-radius:16px; padding:1.2rem; margin-bottom:1rem; }
  .card img{ max-width:100%; border-radius:10px; margin-bottom:.8rem; display:block; max-height:260px; object-fit:cover; }
  .card .row{ font-size:.9rem; margin-bottom:.3rem; line-height:1.6; }
  .card .row b{ color:var(--violet); }
  .card .actions{ display:flex; gap:.6rem; margin-top:1rem; }
  .card .actions button{ flex:1; padding:.6rem; border:none; border-radius:10px; font-weight:700; cursor:pointer; font-family:inherit; font-size:.9rem; color:#fff; }
  .btn-approve{ background:var(--teal); }
  .btn-delete{ background:#c0392b; }
  .btn-unpublish{ background:#c9862a; }
  .empty{ color:var(--muted); text-align:center; padding:2rem 0; }
</style>
</head>
<body>

<div id="loginView" class="login-box">
  <h1>تسجيل الدخول</h1>
  <label for="loginEmail">البريد الإلكتروني</label>
  <input type="email" id="loginEmail">
  <label for="loginPass">كلمة المرور</label>
  <input type="password" id="loginPass">
  <p class="err" id="loginErr"></p>
  <button id="loginBtn">دخول</button>
</div>

<div id="dashView" class="wrap" style="display:none;">
  <div class="top-bar">
    <h1>لوحة تحكم المشاركات</h1>
    <button class="logout" id="logoutBtn">تسجيل خروج</button>
  </div>
  <div class="tabs">
    <button class="tab-btn active" data-tab="pending">قيد المراجعة</button>
    <button class="tab-btn" data-tab="approved">منشورة</button>
  </div>
  <div id="listPending"></div>
  <div id="listApproved" style="display:none;"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script>
(function(){
  var firebaseConfig = {
    apiKey: "AIzaSyARFQTEqJIH5WfA0pIEZQNzhzUuzKkYdtE",
    authDomain: "parents-wall.firebaseapp.com",
    projectId: "parents-wall",
    storageBucket: "parents-wall.firebasestorage.app",
    messagingSenderId: "800264935791",
    appId: "1:800264935791:web:bfc80b7ef266d9ce90b09a"
  };
  firebase.initializeApp(firebaseConfig);
  var auth = firebase.auth();
  var db = firebase.firestore();

  var loginView = document.getElementById('loginView');
  var dashView = document.getElementById('dashView');
  var loginErr = document.getElementById('loginErr');

  document.getElementById('loginBtn').addEventListener('click', function(){
    var email = document.getElementById('loginEmail').value.trim();
    var pass = document.getElementById('loginPass').value;
    loginErr.style.display = 'none';
    auth.signInWithEmailAndPassword(email, pass).catch(function(){
      loginErr.textContent = 'بيانات الدخول غير صحيحة.';
      loginErr.style.display = 'block';
    });
  });

  document.getElementById('logoutBtn').addEventListener('click', function(){
    auth.signOut();
  });

  auth.onAuthStateChanged(function(user){
    if(user){
      loginView.style.display = 'none';
      dashView.style.display = 'block';
      startListening();
    } else {
      loginView.style.display = 'block';
      dashView.style.display = 'none';
    }
  });

  var tabs = document.querySelectorAll('.tab-btn');
  var listPending = document.getElementById('listPending');
  var listApproved = document.getElementById('listApproved');
  tabs.forEach(function(t){
    t.addEventListener('click', function(){
      tabs.forEach(function(x){ x.classList.remove('active'); });
      t.classList.add('active');
      var tab = t.getAttribute('data-tab');
      listPending.style.display = tab === 'pending' ? 'block' : 'none';
      listApproved.style.display = tab === 'approved' ? 'block' : 'none';
    });
  });

  function renderCard(doc, mode){
    var d = doc.data();
    var card = document.createElement('div');
    card.className = 'card';
    if(d.photo){
      var img = document.createElement('img');
      img.src = d.photo;
      card.appendChild(img);
    }
    var rows = [
      ['البرنامج', d.program],
      ['ولي الأمر', d.guardian]
    ];
    if(d.extraLabel && d.extraValue){
      rows.push([d.extraLabel, d.extraValue]);
    }
    rows.push(
      ['الطالبة', d.student],
      ['الصف', d.klass],
      ['النص', d.text]
    );
    rows.forEach(function(r){
      var row = document.createElement('div');
      row.className = 'row';
      var b = document.createElement('b');
      b.textContent = r[0] + ': ';
      row.appendChild(b);
      row.appendChild(document.createTextNode(r[1] || ''));
      card.appendChild(row);
    });
    var actions = document.createElement('div');
    actions.className = 'actions';
    if(mode === 'pending'){
      var approveBtn = document.createElement('button');
      approveBtn.className = 'btn-approve';
      approveBtn.textContent = 'نشر';
      approveBtn.addEventListener('click', function(){
        db.collection('submissions').doc(doc.id).update({ status: 'approved' });
      });
      actions.appendChild(approveBtn);
    } else {
      var unpubBtn = document.createElement('button');
      unpubBtn.className = 'btn-unpublish';
      unpubBtn.textContent = 'إخفاء';
      unpubBtn.addEventListener('click', function(){
        db.collection('submissions').doc(doc.id).update({ status: 'pending' });
      });
      actions.appendChild(unpubBtn);
    }
    var delBtn = document.createElement('button');
    delBtn.className = 'btn-delete';
    delBtn.textContent = 'حذف نهائي';
    delBtn.addEventListener('click', function(){
      if(confirm('متأكدة إنك تبين تحذفين هذي المشاركة نهائياً؟')){
        db.collection('submissions').doc(doc.id).delete();
      }
    });
    actions.appendChild(delBtn);
    card.appendChild(actions);
    return card;
  }

  function renderList(container, docs, mode){
    container.innerHTML = '';
    if(!docs.length){
      var empty = document.createElement('p');
      empty.className = 'empty';
      empty.textContent = mode === 'pending' ? 'لا توجد مشاركات قيد المراجعة.' : 'لا توجد مشاركات منشورة.';
      container.appendChild(empty);
      return;
    }
    docs.sort(function(a, b){
      var ta = (a.data().createdAt && a.data().createdAt.toMillis) ? a.data().createdAt.toMillis() : 0;
      var tb = (b.data().createdAt && b.data().createdAt.toMillis) ? b.data().createdAt.toMillis() : 0;
      return tb - ta;
    });
    docs.forEach(function(doc){
      container.appendChild(renderCard(doc, mode));
    });
  }

  function startListening(){
    db.collection('submissions').where('status', '==', 'pending').onSnapshot(function(snap){
      renderList(listPending, snap.docs, 'pending');
    });
    db.collection('submissions').where('status', '==', 'approved').onSnapshot(function(snap){
      renderList(listApproved, snap.docs, 'approved');
    });
  }
})();
</script>

</body>
</html>
